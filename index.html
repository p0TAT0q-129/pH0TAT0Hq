<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Interactive AOD & Calendar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* [수정] 페이지 자체가 스크롤/팬/바운스 되지 않도록 고정 + touch-action 차단
       → iOS가 터치를 "스크롤"로 가로채 touchend 대신 touchcancel을 보내던 문제 해결 */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: #000000;
    }

    body {
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #master-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0.75;
      transition: opacity 1.5s ease-in-out;
    }

    #master-wrapper.dimmed {
      opacity: 0;
    }

    /* [수정] vw 대신 % 사용 (iOS Safari에서 더 안정적) */
    #slider {
      display: flex;
      width: 200%;
      height: 100%;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    #slider.animating {
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .page {
      width: 50%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
              max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    /* 번인 방지 이동용 래퍼: 화면 기준 px로 천천히 이동 (크기는 JS가 자동 맞춤) */
    .shift-box {
      flex: 0 0 auto;
      transition: transform 3s ease-in-out;
    }

    /* ==================== 1페이지: 시계 및 날씨 ==================== */
    #aod-shift { width: 820px; }

    #aod-container {
      text-align: center;
      width: 100%;
      transform-origin: center center;
    }

    #date {
      font-size: 1.9rem;
      font-weight: 400;
      color: #999999;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    #clock-wrapper {
      display: flex;
      justify-content: center;
      align-items: baseline;
    }

    #clock {
      font-size: 8.8rem;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    #seconds {
      font-size: 2.6rem;
      font-weight: 300;
      color: #777777;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    #dday-banner {
      margin: 16px auto 4px auto;
      display: inline-flex;
      max-width: 100%;
      align-items: center;
      gap: 10px;
      background-color: #121212;
      border: 1px solid #262626;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 1.35rem;
      color: #cccccc;
    }

    #dday-badge {
      font-weight: 700;
      color: #4da6ff;
    }

    #location-name {
      margin-top: 12px;
      font-size: 1.4rem;
      color: #999999;
    }

    #current-weather {
      margin-top: 6px;
      font-size: 2.1rem;
      font-weight: 500;
      color: #dddddd;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    #hourly-weather {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #222222;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .hour-item {
      flex: 1;
      background-color: #0d0d0d;
      border: 1px solid #1a1a1a;
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .hour-time { font-size: 1.05rem; color: #888888; font-variant-numeric: tabular-nums; }
    .hour-icon { font-size: 1.7rem; }
    .hour-temp { font-size: 1.35rem; font-weight: 600; color: #cccccc; font-variant-numeric: tabular-nums; }

    /* ==================== 2페이지: 싱글 월 달력 ==================== */
    #cal-shift { width: 540px; }

    #cal-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform-origin: center center;
    }

    .cal-header-guide {
      font-size: 1.1rem;
      color: #777777;
      text-align: center;
    }

    .month-container {
      background-color: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: 22px;
      padding: 24px 28px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .month-header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .nav-btn {
      background: #161616;
      border: 1px solid #2a2a2a;
      color: #cccccc;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-btn:active { background-color: #2e2e2e; }

    .month-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 1rem;
      color: #666666;
      margin-bottom: 12px;
    }

    .weekdays span:first-child { color: #cc5555; }
    .weekdays span:last-child { color: #5588cc; }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      font-size: 1.2rem;
      color: #cccccc;
      position: relative;
      cursor: pointer;
    }

    .day-cell:active { background-color: #222222; }
    .day-cell.empty { cursor: default; }
    .day-cell.sun { color: #e06666; }
    .day-cell.sat { color: #6fa8dc; }

    .day-cell.today {
      border: 1px solid #4da6ff;
      background-color: rgba(77, 166, 255, 0.12);
      font-weight: 700;
      color: #ffffff;
    }

    .event-dot {
      width: 6px;
      height: 6px;
      background-color: #4da6ff;
      border-radius: 50%;
      margin-top: 4px;
    }

    #page-dots {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 14px);
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
      transition: transform 3s ease-in-out;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #333333;
      transition: background-color 0.3s, width 0.3s;
    }

    .dot.active {
      background-color: #888888;
      width: 18px;
      border-radius: 4px;
    }

    /* ==================== 모달 ==================== */
    #modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #modal-backdrop.open { display: flex; }

    #modal-box {
      background-color: #141414;
      border: 1px solid #2e2e2e;
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      color: #ffffff;
    }

    #modal-date-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #4da6ff;
    }

    #modal-event-list {
      margin-bottom: 16px;
      max-height: 150px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y; /* 모달 목록은 세로 스크롤 허용 */
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .saved-event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1f1f1f;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 1.05rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff6666;
      font-size: 0.95rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    #event-input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333333;
      background-color: #0a0a0a;
      color: #ffffff;
      font-size: 16px; /* iOS 자동 확대 방지 */
      margin-bottom: 14px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel { background-color: #262626; color: #cccccc; }
    .btn-save { background-color: #4da6ff; color: #000000; }
  </style>
</head>
<body>

  <div id="master-wrapper">
    <div id="slider">
      <!-- 1페이지: 시계 & D-Day & 날씨 -->
      <div class="page">
        <div class="shift-box" id="aod-shift">
        <div id="aod-container">
          <div id="date">2026년 11월 15일 일요일</div>
          <div id="clock-wrapper">
            <span id="clock">00:00</span><span id="seconds">00</span>
          </div>
          <div id="dday-banner">
            <span id="dday-badge">D-Day</span>
            <span id="dday-title">등록된 일정이 없습니다 (좌로 밀어 달력 열기)</span>
          </div>
          <div id="location-name">위치 확인 중...</div>
          <div id="current-weather">날씨 불러오는 중...</div>
          <div id="hourly-weather"></div>
        </div>
        </div>
      </div>

      <!-- 2페이지: 싱글 월 달력 -->
      <div class="page" id="calendar-page">
        <div class="shift-box" id="cal-shift">
        <div id="cal-container">
        <div class="cal-header-guide">↕ 위아래로 밀거나 버튼을 눌러 달을 변경하세요 (우로 밀어 시계 복귀)</div>
        <div class="month-container">
          <div class="month-header-nav">
            <button class="nav-btn" id="prev-month-btn">◀</button>
            <div class="month-title" id="month-title-text">2026년 11월</div>
            <button class="nav-btn" id="next-month-btn">▶</button>
          </div>
          <div class="weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="days-grid" id="single-days-grid"></div>
        </div>
        </div>
        </div>
      </div>
    </div>

    <div id="page-dots">
      <div class="dot active" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
    </div>
  </div>

  <!-- 날짜 클릭 모달 -->
  <div id="modal-backdrop">
    <div id="modal-box">
      <div id="modal-date-title">2026-11-15</div>
      <div id="modal-event-list"></div>
      <input type="text" id="event-input" placeholder="일정 제목 입력 (예: 가족 여행)" maxlength="25">
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" id="close-modal-btn">닫기</button>
        <button class="modal-btn btn-save" id="save-event-btn">추가</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // [사용자 설정 영역]
    // ==========================================
    const ACTIVE_DURATION_SEC = 60;
    const ACTIVE_OPACITY = 0.75;
    const FORECAST_HOURS = 6;
    const DEFAULT_LAT = 37.5034;
    const DEFAULT_LON = 126.7660;
    const DEFAULT_LOCATION_NAME = "부천시";
    const SWIPE_THRESHOLD = 50;   // 스와이프로 인정할 최소 이동 거리(px)

    // --- 화면 자동 맞춤 ---
    const FIT_RATIO_LANDSCAPE = 0.8; // 가로 화면에서 내용이 차지할 비율 (0~1)
    const FIT_RATIO_PORTRAIT = 0.9;  // 세로 화면에서 내용이 차지할 비율 (0~1)
    const MIN_SCALE = 0.3;
    const MAX_SCALE = 4;

    // --- 번인 방지 ---
    const SHIFT_INTERVAL_SEC = 60;   // 위치를 옮기는 주기(초)
    const SHIFT_RANGE_RATIO = 0.06;  // 화면 짧은 변 대비 최대 이동 범위
    // ==========================================

    const masterWrapper = document.getElementById('master-wrapper');
    const slider = document.getElementById('slider');
    const aodContainer = document.getElementById('aod-container');
    const aodShift = document.getElementById('aod-shift');
    const calContainer = document.getElementById('cal-container');
    const calShift = document.getElementById('cal-shift');
    const pageDots = document.getElementById('page-dots');
    const clockEl = document.getElementById('clock');
    const secondsEl = document.getElementById('seconds');
    const dateEl = document.getElementById('date');
    const ddayBadgeEl = document.getElementById('dday-badge');
    const ddayTitleEl = document.getElementById('dday-title');
    const locationNameEl = document.getElementById('location-name');
    const currentWeatherEl = document.getElementById('current-weather');
    const hourlyWeatherEl = document.getElementById('hourly-weather');

    const monthTitleText = document.getElementById('month-title-text');
    const singleDaysGrid = document.getElementById('single-days-grid');

    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalDateTitle = document.getElementById('modal-date-title');
    const modalEventList = document.getElementById('modal-event-list');
    const eventInput = document.getElementById('event-input');

    let dimTimer = null;
    let currentPage = 0; // 0: 시계, 1: 달력
    let selectedDateStr = '';

    let calendarViewDate = new Date();
    calendarViewDate.setDate(1); // [수정] 31일에서 월 이동 시 날짜가 밀리는 버그 방지

    let eventsData = {};
    try {
      eventsData = JSON.parse(localStorage.getItem('ipad_aod_events') || '{}');
    } catch (e) {
      eventsData = {};
    }

    function saveEventsToStorage() {
      try {
        localStorage.setItem('ipad_aod_events', JSON.stringify(eventsData));
      } catch (e) {}
    }

    function wakeScreen() {
      masterWrapper.classList.remove('dimmed');
      masterWrapper.style.opacity = ACTIVE_OPACITY;

      if (dimTimer) clearTimeout(dimTimer);
      dimTimer = setTimeout(() => {
        masterWrapper.style.opacity = '0';
        masterWrapper.classList.add('dimmed');
      }, ACTIVE_DURATION_SEC * 1000);

      requestWakeLock();
    }

    // ==========================================
    // [핵심 수정] 스와이프 처리
    //  - touchmove에서 preventDefault (passive:false) → iOS가 터치를 스크롤로 가로채지 않음
    //  - 첫 이동 방향으로 축(가로/세로)을 확정
    //  - 가로 스와이프는 손가락을 따라 페이지가 움직이고, 놓을 때 전환 여부 결정
    //  - touchcancel도 처리
    // ==========================================
    let startX = 0, startY = 0;
    let curX = 0, curY = 0;
    let axis = null;        // 'x' | 'y' | null
    let tracking = false;

    function isInsideModal(target) {
      return modalBackdrop.classList.contains('open');
    }

    function pageWidth() {
      return masterWrapper.clientWidth;
    }

    function setSliderOffset(px) {
      slider.style.transform = `translate3d(${px}px, 0, 0)`;
    }

    function onStart(x, y) {
      wakeScreen();
      if (isInsideModal()) { tracking = false; return; }
      tracking = true;
      axis = null;
      startX = curX = x;
      startY = curY = y;
      slider.classList.remove('animating');
    }

    function onMove(x, y, e) {
      if (!tracking) return;
      curX = x; curY = y;
      const dx = curX - startX;
      const dy = curY - startY;

      if (axis === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 데드존
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }

      if (e && e.cancelable) e.preventDefault();

      if (axis === 'x') {
        let offset = -currentPage * pageWidth() + dx;
        const min = -pageWidth();
        const max = 0;
        // 양 끝에서는 저항감 부여
        if (offset > max) offset = (offset - max) * 0.25;
        if (offset < min) offset = min + (offset - min) * 0.25;
        setSliderOffset(offset);
      }
    }

    function onEnd() {
      if (!tracking) return;
      tracking = false;

      const dx = curX - startX;
      const dy = curY - startY;

      if (axis === 'x') {
        slider.classList.add('animating');
        if (dx < -SWIPE_THRESHOLD && currentPage === 0) {
          goToPage(1);
        } else if (dx > SWIPE_THRESHOLD && currentPage === 1) {
          goToPage(0);
        } else {
          goToPage(currentPage); // 원위치
        }
      } else if (axis === 'y' && currentPage === 1 && Math.abs(dy) > SWIPE_THRESHOLD) {
        changeMonth(dy < 0 ? 1 : -1);
      }
      axis = null;
    }

    function onCancel() {
      if (!tracking) return;
      tracking = false;
      if (axis === 'x') {
        slider.classList.add('animating');
        goToPage(currentPage);
      }
      axis = null;
    }

    // 터치 이벤트 (아이패드)
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      onMove(e.touches[0].clientX, e.touches[0].clientY, e);
    }, { passive: false });

    document.addEventListener('touchend', onEnd, { passive: true });
    document.addEventListener('touchcancel', onCancel, { passive: true });

    // 마우스 이벤트 (PC 브라우저에서 테스트용)
    let mouseDown = false;
    document.addEventListener('mousedown', (e) => {
      mouseDown = true;
      onStart(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', (e) => {
      if (mouseDown) onMove(e.clientX, e.clientY, e);
    });
    document.addEventListener('mouseup', () => {
      if (mouseDown) { mouseDown = false; onEnd(); }
    });

    function goToPage(pageIndex) {
      currentPage = pageIndex;
      slider.classList.add('animating');
      setSliderOffset(-pageIndex * pageWidth());
      document.getElementById('dot-0').classList.toggle('active', pageIndex === 0);
      document.getElementById('dot-1').classList.toggle('active', pageIndex === 1);
      if (pageIndex === 1) renderSingleMonth();
    }

    function changeMonth(delta) {
      calendarViewDate.setDate(1);
      calendarViewDate.setMonth(calendarViewDate.getMonth() + delta);
      renderSingleMonth();
    }

    document.getElementById('prev-month-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      changeMonth(-1);
    });

    document.getElementById('next-month-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      changeMonth(1);
    });

    function renderSingleMonth() {
      singleDaysGrid.innerHTML = '';
      const year = calendarViewDate.getFullYear();
      const month = calendarViewDate.getMonth();

      monthTitleText.textContent = `${year}년 ${month + 1}월`;

      const now = new Date();
      const todayStr = formatDateStr(now.getFullYear(), now.getMonth() + 1, now.getDate());

      const firstDayOfWeek = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        singleDaysGrid.appendChild(emptyCell);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = formatDateStr(year, month + 1, d);
        const dayOfWeek = new Date(year, month, d).getDay();

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (dayOfWeek === 0) cell.classList.add('sun');
        if (dayOfWeek === 6) cell.classList.add('sat');
        if (dateStr === todayStr) cell.classList.add('today');

        const numSpan = document.createElement('span');
        numSpan.textContent = d;
        cell.appendChild(numSpan);

        if (eventsData[dateStr] && eventsData[dateStr].length > 0) {
          const dot = document.createElement('div');
          dot.className = 'event-dot';
          cell.appendChild(dot);
        }

        cell.addEventListener('click', (e) => {
          e.stopPropagation();
          openDateModal(dateStr);
        });

        singleDaysGrid.appendChild(cell);
      }
    }

    function formatDateStr(y, m, d) {
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function updateClockAndDDay() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      clockEl.textContent = `${hours}:${minutes}`;
      secondsEl.textContent = seconds;

      const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      dateEl.textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}`;

      updateNearestDDay(now);
    }

    function updateNearestDDay(now) {
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      let nearestDiffDays = Infinity;
      let nearestTitle = '';

      for (const [dateStr, titles] of Object.entries(eventsData)) {
        if (!titles || titles.length === 0) continue;
        const [y, m, d] = dateStr.split('-').map(Number);
        const targetMidnight = new Date(y, m - 1, d).getTime();
        const diffDays = Math.round((targetMidnight - todayMidnight) / (1000 * 60 * 60 * 24));

        if (diffDays >= 0 && diffDays < nearestDiffDays) {
          nearestDiffDays = diffDays;
          nearestTitle = titles[0];
        }
      }

      if (nearestDiffDays === Infinity) {
        ddayBadgeEl.textContent = '📅';
        ddayTitleEl.textContent = '예정된 D-Day 없음 (좌로 밀어 일정 추가)';
      } else if (nearestDiffDays === 0) {
        ddayBadgeEl.textContent = 'D-Day';
        ddayTitleEl.textContent = `오늘: ${nearestTitle}`;
      } else {
        ddayBadgeEl.textContent = `D-${nearestDiffDays}`;
        ddayTitleEl.textContent = nearestTitle;
      }
    }

    function openDateModal(dateStr) {
      selectedDateStr = dateStr;
      modalDateTitle.textContent = `${dateStr} 일정 관리`;
      eventInput.value = '';
      renderModalEventList();
      modalBackdrop.classList.add('open');
    }

    function renderModalEventList() {
      modalEventList.innerHTML = '';
      const list = eventsData[selectedDateStr] || [];

      if (list.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'color:#666; font-size:0.95rem;';
        empty.textContent = '등록된 일정이 없습니다.';
        modalEventList.appendChild(empty);
        return;
      }

      list.forEach((title, idx) => {
        const item = document.createElement('div');
        item.className = 'saved-event-item';

        const span = document.createElement('span');
        span.textContent = title; // [수정] innerHTML 대신 textContent (특수문자 안전)
        item.appendChild(span);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '삭제';
        delBtn.addEventListener('click', () => {
          eventsData[selectedDateStr].splice(idx, 1);
          if (eventsData[selectedDateStr].length === 0) delete eventsData[selectedDateStr];
          saveEventsToStorage();
          renderModalEventList();
          renderSingleMonth();
          updateNearestDDay(new Date());
        });

        item.appendChild(delBtn);
        modalEventList.appendChild(item);
      });
    }

    document.getElementById('save-event-btn').addEventListener('click', () => {
      const val = eventInput.value.trim();
      if (!val) return;

      if (!eventsData[selectedDateStr]) eventsData[selectedDateStr] = [];
      eventsData[selectedDateStr].push(val);
      saveEventsToStorage();

      eventInput.value = '';
      renderModalEventList();
      renderSingleMonth();
      updateNearestDDay(new Date());
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modalBackdrop.classList.remove('open');
    });

    // ==========================================
    // 화면 자동 맞춤 + 번인 방지 위치 이동
    // ==========================================
    const fitState = new Map();
    let layoutQueued = false;
    let lastW = 0;
    let lastShift = { x: 0, y: 0 }; // -1 ~ 1 정규화 좌표

    // 고정 폭(designW)으로 배치한 내용을 화면 크기에 맞춰 확대/축소
    function fitBlock(shiftEl, fitEl, designW, ratio) {
      const page = shiftEl.parentElement;
      const cs = getComputedStyle(page);
      const availW = page.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const availH = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      if (availW <= 0 || availH <= 0) return;

      shiftEl.style.width = designW + 'px';
      const natW = Math.max(designW, fitEl.scrollWidth);
      const natH = fitEl.offsetHeight || 1;
      let s = Math.min(availW * ratio / natW, availH * ratio / natH);
      s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
      fitEl.style.transform = `scale(${s})`;

      fitState.set(shiftEl, {
        freeX: Math.max(0, (availW - natW * s) / 2),
        freeY: Math.max(0, (availH - natH * s) / 2)
      });
    }

    function applyLayout() {
      layoutQueued = false;
      const w = masterWrapper.clientWidth;
      const h = masterWrapper.clientHeight;
      if (!w || !h) return;

      const portrait = h > w;
      const ratio = portrait ? FIT_RATIO_PORTRAIT : FIT_RATIO_LANDSCAPE;
      fitBlock(aodShift, aodContainer, portrait ? 520 : 820, ratio);
      fitBlock(calShift, calContainer, portrait ? 440 : 540, ratio);

      if (w !== lastW) {
        lastW = w;
        slider.classList.remove('animating');
        setSliderOffset(-currentPage * w);
      }
      applyShift();
    }

    function scheduleLayout() {
      if (layoutQueued) return;
      layoutQueued = true;
      requestAnimationFrame(applyLayout);
    }

    // 이전 위치에서 충분히 먼 곳을 골라 같은 픽셀이 계속 켜져 있지 않게 함
    function pickShift() {
      let best = lastShift, bestD = -1;
      for (let i = 0; i < 12; i++) {
        const c = { x: Math.random() * 2 - 1, y: Math.random() * 2 - 1 };
        const d = Math.hypot(c.x - lastShift.x, c.y - lastShift.y);
        if (d > bestD) { best = c; bestD = d; }
        if (d >= 1) break;
      }
      return best;
    }

    function applyShift() {
      const short = Math.min(masterWrapper.clientWidth, masterWrapper.clientHeight);
      const cap = Math.max(6, Math.min(60, short * SHIFT_RANGE_RATIO));
      [aodShift, calShift].forEach((el) => {
        const f = fitState.get(el) || { freeX: 0, freeY: 0 };
        const mx = Math.min(cap, f.freeX);
        const my = Math.min(cap, f.freeY);
        el.style.transform = `translate(${Math.round(lastShift.x * mx)}px, ${Math.round(lastShift.y * my)}px)`;
      });
      const d = Math.min(cap, 12);
      pageDots.style.transform = `translate(${Math.round(lastShift.x * d)}px, ${Math.round(lastShift.y * d)}px)`;
    }

    function shiftPosition() {
      lastShift = pickShift();
      applyShift();
    }

    window.addEventListener('resize', scheduleLayout);
    window.addEventListener('orientationchange', () => setTimeout(scheduleLayout, 200));
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(scheduleLayout);
      ro.observe(masterWrapper);
      ro.observe(aodContainer);
      ro.observe(calContainer);
    }

    function initLocationAndWeather() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            fetchLocationName(pos.coords.latitude, pos.coords.longitude);
            fetchWeather(pos.coords.latitude, pos.coords.longitude);
          },
          () => {
            locationNameEl.textContent = DEFAULT_LOCATION_NAME;
            fetchWeather(DEFAULT_LAT, DEFAULT_LON);
          },
          { timeout: 10000, maximumAge: 60000 }
        );
      } else {
        locationNameEl.textContent = DEFAULT_LOCATION_NAME;
        fetchWeather(DEFAULT_LAT, DEFAULT_LON);
      }
    }

    async function fetchLocationName(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ko`);
        const data = await res.json();
        const addr = data.address;
        const city = addr.city || addr.county || addr.municipality || "";
        const borough = addr.borough || addr.suburb || addr.town || addr.village || "";
        locationNameEl.textContent = `${city} ${borough}`.trim() || "현재 위치";
      } catch (e) {
        locationNameEl.textContent = "현재 위치";
      }
    }

    async function fetchWeather(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&timezone=auto&forecast_days=2`;
        const res = await fetch(url);
        const data = await res.json();

        const currentTemp = Math.round(data.current_weather.temperature);
        const currentInfo = getWeatherDescription(data.current_weather.weathercode);
        currentWeatherEl.innerHTML = `<span>${currentInfo.icon}</span> <span>${currentTemp}°C</span> <span style="font-size: 1.4rem; color: #888;">${currentInfo.text}</span>`;

        const now = new Date();
        const currentPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}:00`;

        const times = data.hourly.time;
        const temps = data.hourly.temperature_2m;
        const codes = data.hourly.weathercode;

        let startIndex = times.findIndex(t => t === currentPrefix);
        if (startIndex === -1) startIndex = 0;

        let hourlyHTML = '';
        for (let i = 1; i <= FORECAST_HOURS; i++) {
          const idx = startIndex + i;
          if (idx < times.length) {
            const hourLabel = times[idx].split('T')[1].substring(0, 5);
            const temp = Math.round(temps[idx]);
            const info = getWeatherDescription(codes[idx]);

            hourlyHTML += `
              <div class="hour-item">
                <div class="hour-time">${hourLabel}</div>
                <div class="hour-icon">${info.icon}</div>
                <div class="hour-temp">${temp}°</div>
              </div>
            `;
          }
        }
        hourlyWeatherEl.innerHTML = hourlyHTML;
      } catch (e) {
        currentWeatherEl.textContent = '날씨 정보 연결 대기중';
      }
    }

    function getWeatherDescription(code) {
      if (code === 0) return { icon: '☀️', text: '맑음' };
      if (code >= 1 && code <= 3) return { icon: '⛅', text: '구름 조금' };
      if (code >= 45 && code <= 48) return { icon: '🌫️', text: '안개' };
      if (code >= 51 && code <= 67) return { icon: '🌧️', text: '비' };
      if (code >= 71 && code <= 77) return { icon: '❄️', text: '눈' };
      if (code >= 80 && code <= 82) return { icon: '🌦️', text: '소나기' };
      if (code >= 95) return { icon: '⛈️', text: '뇌우' };
      return { icon: '☁️', text: '흐림' };
    }

    let wakeLockSentinel = null;
    let wakeLockPending = false;
    async function requestWakeLock() {
      if (!('wakeLock' in navigator) || wakeLockSentinel || wakeLockPending) return;
      wakeLockPending = true;
      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
      } catch (err) {
        wakeLockSentinel = null;
      } finally {
        wakeLockPending = false;
      }
    }

    // 초기 실행
    updateClockAndDDay();
    setInterval(updateClockAndDDay, 1000);

    renderSingleMonth();
    applyLayout();
    shiftPosition();
    setInterval(shiftPosition, SHIFT_INTERVAL_SEC * 1000);

    initLocationAndWeather();
    setInterval(initLocationAndWeather, 1800000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') wakeScreen();
    });

    wakeScreen();
  </script>
</body>
