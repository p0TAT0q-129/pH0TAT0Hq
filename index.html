<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 아이패드 홈 화면 추가 시 주소창 제거 (전체 화면 앱 모드) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>iPad AOD Clock & GPS Weather</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 번인 방지를 위해 위치가 미세하게 움직일 메인 컨테이너 */
    #aod-container {
      text-align: center;
      transition: transform 2s ease-in-out, opacity 1.5s ease-in-out;
      width: 90%;
      max-width: 800px;
    }

    #date {
      font-size: 2rem;
      font-weight: 400;
      color: #888888;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    #clock-wrapper {
      display: flex;
      justify-content: center;
      align-items: baseline;
    }

    #clock {
      font-size: 9rem;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #seconds {
      font-size: 2.8rem;
      font-weight: 300;
      color: #666666;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    /* 위치 이름 표시 영역 */
    #location-name {
      margin-top: 15px;
      font-size: 1.5rem;
      color: #888888;
      font-weight: 400;
    }

    /* 현재 날씨 영역 */
    #current-weather {
      margin-top: 8px;
      font-size: 2.2rem;
      font-weight: 500;
      color: #cccccc;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    /* 시간별 예보 컨테이너 */
    #hourly-weather {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #222222;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .hour-item {
      flex: 1;
      background-color: #0d0d0d;
      border: 1px solid #1a1a1a;
      border-radius: 14px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .hour-time {
      font-size: 1.1rem;
      color: #777777;
      font-variant-numeric: tabular-nums;
    }

    .hour-icon {
      font-size: 1.8rem;
    }

    .hour-temp {
      font-size: 1.4rem;
      font-weight: 600;
      color: #bbbbbb;
      font-variant-numeric: tabular-nums;
    }

    /* 지정된 야간 시간대 화면 숨김 처리 */
    .sleep-mode {
      opacity: 0 !important;
    }
  </style>
</head>
<body>

  <div id="aod-container">
    <div id="date">2026년 11월 15일 일요일</div>
    <div id="clock-wrapper">
      <span id="clock">00:00</span><span id="seconds">00</span>
    </div>
    <div id="location-name">위치 확인 중...</div>
    <div id="current-weather">날씨 불러오는 중...</div>
    <div id="hourly-weather"></div>
  </div>

  <script>
    // ==========================================
    // [사용자 설정 영역] 야간 절전 시간 설정
    // ==========================================
    const SLEEP_START_HOUR = 1;  // 화면 꺼짐(암전) 시작 시간 (새벽 1시 = 1)
    const SLEEP_END_HOUR = 7;    // 화면 켜짐 시간 (아침 7시 = 7)
    const FORECAST_HOURS = 6;    // 표시할 시간별 예보 개수 (향후 6시간)
    
    // GPS 위치를 가져오지 못할 때의 기본값 (기본: 부천시청 부근)
    const DEFAULT_LAT = 37.5034;
    const DEFAULT_LON = 126.7660;
    const DEFAULT_LOCATION_NAME = "부천시";
    // ==========================================

    const container = document.getElementById('aod-container');
    const clockEl = document.getElementById('clock');
    const secondsEl = document.getElementById('seconds');
    const dateEl = document.getElementById('date');
    const locationNameEl = document.getElementById('location-name');
    const currentWeatherEl = document.getElementById('current-weather');
    const hourlyWeatherEl = document.getElementById('hourly-weather');

    // 1. 시계 및 야간 슬립 모드 체크 (1초마다 실행)
    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      let isSleepTime = false;
      if (SLEEP_START_HOUR < SLEEP_END_HOUR) {
        isSleepTime = hours >= SLEEP_START_HOUR && hours < SLEEP_END_HOUR;
      } else {
        isSleepTime = hours >= SLEEP_START_HOUR || hours < SLEEP_END_HOUR;
      }

      if (isSleepTime) {
        container.classList.add('sleep-mode');
      } else {
        container.classList.remove('sleep-mode');
      }

      clockEl.textContent = `${String(hours).padStart(2, '0')}:${minutes}`;
      secondsEl.textContent = seconds;

      const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      dateEl.textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}`;
    }

    // 2. 번인(잔상) 방지: 2분마다 화면 위치를 미세 이동
    function shiftPosition() {
      const offsetX = Math.floor(Math.random() * 31) - 15;
      const offsetY = Math.floor(Math.random() * 31) - 15;
      container.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }

    // 3. GPS 위치 정보 획득 및 날씨 데이터 연동
    function initLocationAndWeather() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // GPS 좌표를 기반으로 동네 이름 가져오기 (OpenStreetMap Nominatim API)
            fetchLocationName(lat, lon);
            // 날씨 데이터 가져오기
            fetchWeather(lat, lon);
          },
          (error) => {
            console.log('GPS 권한 거부 또는 에러, 기본 위치로 대체합니다.', error);
            locationNameEl.textContent = DEFAULT_LOCATION_NAME;
            fetchWeather(DEFAULT_LAT, DEFAULT_LON);
          },
          { timeout: 10000, maximumAge: 60000 }
        );
      } else {
        locationNameEl.textContent = DEFAULT_LOCATION_NAME;
        fetchWeather(DEFAULT_LAT, DEFAULT_LON);
      }
    }

    // 위·경도를 동네 이름으로 변환하는 함수
    async function fetchLocationName(lat, lon) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ko`);
        const data = await response.json();
        const address = data.address;
        
        // 시, 군, 구, 동 단위 추출
        const city = address.city || address.county || address.municipality || "";
        const borough = address.borough || address.suburb || address.town || address.village || "";
        
        locationNameEl.textContent = `${city} ${borough}`.trim() || "현재 위치";
      } catch (e) {
        locationNameEl.textContent = "현재 위치";
      }
    }

    // Open-Meteo 날씨 API 호출
    async function fetchWeather(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&timezone=auto&forecast_days=2`;
        const response = await fetch(url);
        const data = await response.json();

        // 현재 날씨 업데이트
        const currentTemp = Math.round(data.current_weather.temperature);
        const currentCode = data.current_weather.weathercode;
        const currentInfo = getWeatherDescription(currentCode);
        currentWeatherEl.innerHTML = `<span>${currentInfo.icon}</span> <span>${currentTemp}°C</span> <span style="font-size: 1.5rem; color: #777;">${currentInfo.text}</span>`;

        // 시간별 예보 업데이트
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
        const currentDay = String(now.getDate()).padStart(2, '0');
        const currentHourStr = String(now.getHours()).padStart(2, '0');
        const currentPrefix = `${currentYear}-${currentMonth}-${currentDay}T${currentHourStr}:00`;

        const times = data.hourly.time;
        const temps = data.hourly.temperature_2m;
        const codes = data.hourly.weathercode;

        let startIndex = times.findIndex(t => t === currentPrefix);
        if (startIndex === -1) startIndex = 0;

        let hourlyHTML = '';
        for (let i = 1; i <= FORECAST_HOURS; i++) {
          const idx = startIndex + i;
          if (idx < times.length) {
            const hourLabel = times[idx].split('T')[1].substring(0, 5);
            const temp = Math.round(temps[idx]);
            const info = getWeatherDescription(codes[idx]);

            hourlyHTML += `
              <div class="hour-item">
                <div class="hour-time">${hourLabel}</div>
                <div class="hour-icon">${info.icon}</div>
                <div class="hour-temp">${temp}°</div>
              </div>
            `;
          }
        }
        hourlyWeatherEl.innerHTML = hourlyHTML;

      } catch (error) {
        currentWeatherEl.textContent = '날씨 정보 연결 대기중';
      }
    }

    // WMO 날씨 코드 변환
    function getWeatherDescription(code) {
      if (code === 0) return { icon: '☀️', text: '맑음' };
      if (code >= 1 && code <= 3) return { icon: '⛅', text: '구름 조금' };
      if (code >= 45 && code <= 48) return { icon: '🌫️', text: '안개' };
      if (code >= 51 && code <= 67) return { icon: '🌧️', text: '비' };
      if (code >= 71 && code <= 77) return { icon: '❄️', text: '눈' };
      if (code >= 80 && code <= 82) return { icon: '🌦️', text: '소나기' };
      if (code >= 95) return { icon: '⛈️', text: '뇌우' };
      return { icon: '☁️', text: '흐림' };
    }

    // 4. 화면 꺼짐 방지 (Wake Lock API)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock 대기 중:', err);
      }
    }

    // 초기 실행 및 타이머
    updateClock();
    setInterval(updateClock, 1000);

    shiftPosition();
    setInterval(shiftPosition, 120000); // 2분마다 미세 이동

    initLocationAndWeather();
    setInterval(initLocationAndWeather, 1800000); // 30분마다 위치 및 날씨 재확인

    document.addEventListener('click', requestWakeLock);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();
  </script>
</body>
</html>
