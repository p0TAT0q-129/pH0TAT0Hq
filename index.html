<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>iPad Interactive AOD Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    /* 번인 방지용 미세 이동 컨테이너 */
    #aod-container {
      text-align: center;
      transition: transform 2s ease-in-out, opacity 1.5s ease-in-out;
      width: 90%;
      max-width: 800px;
      opacity: 0.75; /* 기본 활성 상태 밝기 느낌 (아이패드 밝기 100% 기준 약 70~75% 수준) */
    }

    /* 3분 경과 후 화면 암전(0%) 상태 */
    #aod-container.dimmed {
      opacity: 0;
    }

    #date {
      font-size: 2rem;
      font-weight: 400;
      color: #999999;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    #clock-wrapper {
      display: flex;
      justify-content: center;
      align-items: baseline;
    }

    #clock {
      font-size: 9rem;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    #seconds {
      font-size: 2.8rem;
      font-weight: 300;
      color: #777777;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    #location-name {
      margin-top: 15px;
      font-size: 1.5rem;
      color: #999999;
      font-weight: 400;
    }

    #current-weather {
      margin-top: 8px;
      font-size: 2.2rem;
      font-weight: 500;
      color: #dddddd;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    #hourly-weather {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #222222;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .hour-item {
      flex: 1;
      background-color: #0d0d0d;
      border: 1px solid #1a1a1a;
      border-radius: 14px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .hour-time {
      font-size: 1.1rem;
      color: #888888;
      font-variant-numeric: tabular-nums;
    }

    .hour-icon {
      font-size: 1.8rem;
    }

    .hour-temp {
      font-size: 1.4rem;
      font-weight: 600;
      color: #cccccc;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div id="aod-container">
    <div id="date">2026년 11월 15일 일요일</div>
    <div id="clock-wrapper">
      <span id="clock">00:00</span><span id="seconds">00</span>
    </div>
    <div id="location-name">위치 확인 중...</div>
    <div id="current-weather">날씨 불러오는 중...</div>
    <div id="hourly-weather"></div>
  </div>

  <script>
    // ==========================================
    // [사용자 설정 영역]
    // ==========================================
    const ACTIVE_DURATION_SEC = 180; // 터치 후 화면 유지 시간 (3분 = 180초)
    const ACTIVE_OPACITY = 0.7;      // 활성 시 텍스트/요소 밝기 비율 (0.7 = 70%)
    const FORECAST_HOURS = 6;        // 시간별 예보 표시 개수
    
    // GPS 실패 시 기본 좌표 (부천시 기준)
    const DEFAULT_LAT = 37.5034;
    const DEFAULT_LON = 126.7660;
    const DEFAULT_LOCATION_NAME = "부천시";
    // ==========================================

    const container = document.getElementById('aod-container');
    const clockEl = document.getElementById('clock');
    const secondsEl = document.getElementById('seconds');
    const dateEl = document.getElementById('date');
    const locationNameEl = document.getElementById('location-name');
    const currentWeatherEl = document.getElementById('current-weather');
    const hourlyWeatherEl = document.getElementById('hourly-weather');

    let dimTimer = null;

    // 1. 터치 반응형 3분 타이머 제어 함수
    function wakeScreen() {
      // 화면 밝기(불투명도)를 70%로 복구
      container.classList.remove('dimmed');
      container.style.opacity = ACTIVE_OPACITY;

      // 기존 타이머가 있다면 초기화 (터치할 때마다 3분 연장)
      if (dimTimer) {
        clearTimeout(dimTimer);
      }

      // 3분(180,000ms) 후 밝기 0%로 서서히 암전
      dimTimer = setTimeout(() => {
        container.style.opacity = '0';
        container.classList.add('dimmed');
      }, ACTIVE_DURATION_SEC * 1000);

      // 터치할 때마다 화면 꺼짐 방지(Wake Lock) 재확인
      requestWakeLock();
    }

    // 화면 전체 어디든 터치하거나 클릭하면 3분 타이머 작동
    document.body.addEventListener('touchstart', wakeScreen, { passive: true });
    document.body.addEventListener('click', wakeScreen);

    // 2. 시계 업데이트 (1초마다 실행)
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      clockEl.textContent = `${hours}:${minutes}`;
      secondsEl.textContent = seconds;

      const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      dateEl.textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}`;
    }

    // 3. 번인 방지 미세 이동 (2분마다)
    function shiftPosition() {
      const offsetX = Math.floor(Math.random() * 31) - 15;
      const offsetY = Math.floor(Math.random() * 31) - 15;
      container.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }

    // 4. GPS 위치 및 날씨 정보 연동
    function initLocationAndWeather() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetchLocationName(lat, lon);
            fetchWeather(lat, lon);
          },
          () => {
            locationNameEl.textContent = DEFAULT_LOCATION_NAME;
            fetchWeather(DEFAULT_LAT, DEFAULT_LON);
          },
          { timeout: 10000, maximumAge: 60000 }
        );
      } else {
        locationNameEl.textContent = DEFAULT_LOCATION_NAME;
        fetchWeather(DEFAULT_LAT, DEFAULT_LON);
      }
    }

    async function fetchLocationName(lat, lon) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ko`);
        const data = await response.json();
        const address = data.address;
        const city = address.city || address.county || address.municipality || "";
        const borough = address.borough || address.suburb || address.town || address.village || "";
        locationNameEl.textContent = `${city} ${borough}`.trim() || "현재 위치";
      } catch (e) {
        locationNameEl.textContent = "현재 위치";
      }
    }

    async function fetchWeather(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&timezone=auto&forecast_days=2`;
        const response = await fetch(url);
        const data = await response.json();

        const currentTemp = Math.round(data.current_weather.temperature);
        const currentCode = data.current_weather.weathercode;
        const currentInfo = getWeatherDescription(currentCode);
        currentWeatherEl.innerHTML = `<span>${currentInfo.icon}</span> <span>${currentTemp}°C</span> <span style="font-size: 1.5rem; color: #888;">${currentInfo.text}</span>`;

        const now = new Date();
        const currentPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}:00`;

        const times = data.hourly.time;
        const temps = data.hourly.temperature_2m;
        const codes = data.hourly.weathercode;

        let startIndex = times.findIndex(t => t === currentPrefix);
        if (startIndex === -1) startIndex = 0;

        let hourlyHTML = '';
        for (let i = 1; i <= FORECAST_HOURS; i++) {
          const idx = startIndex + i;
          if (idx < times.length) {
            const hourLabel = times[idx].split('T')[1].substring(0, 5);
            const temp = Math.round(temps[idx]);
            const info = getWeatherDescription(codes[idx]);

            hourlyHTML += `
              <div class="hour-item">
                <div class="hour-time">${hourLabel}</div>
                <div class="hour-icon">${info.icon}</div>
                <div class="hour-temp">${temp}°</div>
              </div>
            `;
          }
        }
        hourlyWeatherEl.innerHTML = hourlyHTML;
      } catch (error) {
        currentWeatherEl.textContent = '날씨 정보 연결 대기중';
      }
    }

    function getWeatherDescription(code) {
      if (code === 0) return { icon: '☀️', text: '맑음' };
      if (code >= 1 && code <= 3) return { icon: '⛅', text: '구름 조금' };
      if (code >= 45 && code <= 48) return { icon: '🌫️', text: '안개' };
      if (code >= 51 && code <= 67) return { icon: '🌧️', text: '비' };
      if (code >= 71 && code <= 77) return { icon: '❄️', text: '눈' };
      if (code >= 80 && code <= 82) return { icon: '🌦️', text: '소나기' };
      if (code >= 95) return { icon: '⛈️', text: '뇌우' };
      return { icon: '☁️', text: '흐림' };
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock 대기 중:', err);
      }
    }

    // 초기 실행
    updateClock();
    setInterval(updateClock, 1000);

    shiftPosition();
    setInterval(shiftPosition, 120000);

    initLocationAndWeather();
    setInterval(initLocationAndWeather, 1800000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') wakeScreen();
    });

    // 페이지 최초 로드 시 3분 타이머 시작
    wakeScreen();
  </script>
</body>
</html>
